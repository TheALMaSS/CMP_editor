name: Build CMP Editor

# Produces the Windows executable so testers can download a build without
# installing Python. Also runs the headless validation tests on every push.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you build on demand from the Actions tab

permissions:
  contents: read

jobs:
  test:
    name: Validation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # test_validation.py deliberately avoids PyQt5 so the rules can be checked
      # headlessly -- no display, no Qt install needed.
      - name: Run validation tests
        run: python test_validation.py

      - name: Byte-compile all modules
        run: python -m compileall -q .

  build-windows:
    name: Windows executable
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm cropgen.spec

      # Fail loudly if the bundle is missing its data files. Without this a broken
      # build still "succeeds" and only fails when a user opens the app -- exactly
      # the silent-failure pattern this project has been fighting.
      - name: Verify bundled data files
        shell: pwsh
        run: |
          if (-Not (Test-Path "dist/cropgen.exe")) {
            Write-Error "dist/cropgen.exe was not produced"; exit 1
          }
          $size = (Get-Item "dist/cropgen.exe").Length
          Write-Host "cropgen.exe size: $([math]::Round($size/1MB,1)) MB"
          if ($size -lt 10MB) {
            Write-Error "Executable is implausibly small - PyQt5 likely not bundled"; exit 1
          }

      - name: Name the artifact
        shell: pwsh
        run: |
          $stamp = Get-Date -Format "yyyyMMdd"
          $sha = "${{ github.sha }}".Substring(0,7)
          Copy-Item "dist/cropgen.exe" "dist/CMP-Editor-$stamp-$sha.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: CMP-Editor-windows
          path: dist/CMP-Editor-*.exe
          retention-days: 90
          if-no-files-found: error
